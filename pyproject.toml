[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-detection"
version = "1.0.0"
description = "YOLO Object Detection for Vercel"
requires-python = ">=3.9"
dependencies = [
    "opencv-python-headless==4.8.1.78",
    "pillow==10.0.1",
    "numpy==1.24.3",
    "ultralytics==8.0.200"
]

[project.optional-dependencies]
# No GPU/CUDA dependencies for Vercel

[tool.pip]
no-binary = ["numpy", "opencv-python-headless"]

[tool.setuptools]
packages = []
